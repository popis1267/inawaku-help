<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いなわくTV ヘルプ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #f4f8f8; color: #263c40;
  font: 18px/1.8 system-ui, sans-serif;
}
header { background: #086d77; color: white; padding: 32px 20px; }
header div, main { max-width: 820px; margin: auto; }
h1 { font-size: clamp(28px, 6vw, 40px); margin: 0; }
header p { margin: 8px 0 0; }
main { padding: 28px 20px 60px; }
label { display: block; font-weight: bold; margin-bottom: 8px; }
input {
  width: 100%; padding: 16px; border: 2px solid #789498;
  border-radius: 12px; font: inherit;
}
button, .link {
  display: inline-block; padding: 14px 20px; margin: 8px 8px 8px 0;
  border: 0; border-radius: 10px; background: #086d77;
  color: white; font: inherit; text-decoration: none; cursor: pointer;
}
.examples button { background: white; color: #086d77; border: 1px solid #789498; }
article {
  margin-top: 20px; padding: 24px; background: white;
  border: 1px solid #b8cccc; border-radius: 16px;
}
h2 { font-size: 23px; margin-top: 0; }
.note { color: #526b70; font-size: 16px; }
a { color: #086d77; }
:focus-visible { outline: 3px solid #c17400; outline-offset: 4px; }
footer { margin-top: 32px; }
</style>
</head>
<body>
<header><div>
  <h1>いなわくTV ヘルプ</h1>
  <p>知りたいことを質問してください</p>
</div></header>
<main>
  <p class="note">試作版：メンバー動画に関する2件の回答を掲載しています。</p>
  <form id="form">
    <label for="question">どんなことを知りたいですか？</label>
    <input id="question" type="search" required maxlength="300"
      placeholder="例：メンバー動画はどこで見るの？">
    <button type="submit">回答を見る</button>
  </form>
  <div class="examples">
    <p>下の質問を押して試すこともできます。</p>
    <button type="button" data-question="メンバー動画はどこで見るの？">
      メンバー動画はどこで見るの？
    </button>
    <button type="button" data-question="メンバーシップの使い方を教えて">
      メンバーシップの使い方を教えて
    </button>
  </div>
  <p id="status" role="status"></p>
  <section id="answers" aria-label="回答"></section>
  <footer><a href="https://inawakutv.com/">いなわくTVのホームページへ</a></footer>
</main>
<script>
const records = [
  {
    title: 'メンバーシップの使い方の動画はありますか？',
    answer: 'はい。メンバーシップ専用の使い方の動画をご用意しております。下のボタンから再生リストをご覧ください。',
    links: [
      ['使い方の動画を見る', 'https://youtube.com/playlist?list=PLa3belS0rIMbMLR-Utkl3t_3OWtoWyhmN']
    ]
  },
  {
    title: 'メンバー専用動画はどうやって観れますか？',
    answer: 'メンバーシップ限定（VIP）より上位レベルの方には、専用動画がございます。Wordのんびり講座と、エクセル仕事で使えるビジネス関数講座は、下の再生リストからご覧ください。',
    links: [
      ['Wordのんびり講座を見る', 'https://youtube.com/playlist?list=PLa3belS0rIMYMaNsZpFIXmf2s0DtHZBel'],
      ['エクセルのビジネス関数講座を見る', 'https://youtube.com/playlist?list=PLa3belS0rIMYK5msG9FxnIudmHVWBFNQx']
    ]
  }
];
const field = document.getElementById('question');
const answers = document.getElementById('answers');
const status = document.getElementById('status');

function selectAnswers(text) {
  const q = text.normalize('NFKC').toLowerCase().replace(/\s/g, '');
  if (/退会|解約|支払|料金|返金|パスワード|メール|電話|zoom|ズーム|ライブ/.test(q)) {
    return [];
  }
  const member = /メンバー|会員|vip/.test(q);
  const video = /動画|ビデオ|再生リスト/.test(q);
  const use = /使い方|つかいかた|利用方法/.test(q);
  const watch = /どこ|見る|みる|観|見れ|見られ|視聴|どうやって|開/.test(q);
  const lesson = /word|ワード|のんびり|excel|エクセル|関数/.test(q);
  const ids = [];
  if (member && use) ids.push(0);
  if (lesson || (member && video && watch && !use)) ids.push(1);
  if (member && video && !ids.length) ids.push(0, 1);
  return ids;
}

function showAnswer() {
  answers.replaceChildren();
  const ids = selectAnswers(field.value);
  if (!ids.length) {
    status.textContent = 'この試作には、質問に合う回答が見つかりませんでした。現在はメンバー動画の使い方と視聴案内に対応しています。';
    return;
  }
  status.textContent = ids.length === 1
    ? '関連する回答が1件見つかりました。'
    : '関連する回答が2件見つかりました。知りたい内容をご確認ください。';
  for (const id of ids) {
    const record = records[id];
    const card = document.createElement('article');
    const heading = document.createElement('h2');
    heading.textContent = record.title;
    const paragraph = document.createElement('p');
    paragraph.textContent = record.answer;
    card.append(heading, paragraph);
    for (const [label, url] of record.links) {
      const link = document.createElement('a');
      link.className = 'link';
      link.href = url;
      link.textContent = label;
      card.append(link);
    }
    answers.append(card);
  }
}
document.getElementById('form').addEventListener('submit', event => {
  event.preventDefault();
  showAnswer();
});
field.addEventListener('input', () => {
  answers.replaceChildren();
  status.textContent = '';
});
document.querySelectorAll('[data-question]').forEach(button => {
  button.addEventListener('click', () => {
    field.value = button.dataset.question;
    showAnswer();
  });
});
</script>
</body>
</html>
