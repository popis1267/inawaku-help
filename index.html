<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いなわくTV ヘルプ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #f4f8f8; color: #263c40;
  font-family: system-ui, sans-serif; font-size: 18px; line-height: 1.8;
}
header { background: #086d77; color: white; padding: 32px 20px; }
header div, main { max-width: 820px; margin: auto; }
h1 { font-size: clamp(28px, 6vw, 40px); margin: 0; }
header p { margin: 8px 0 0; }
main { padding: 28px 20px 60px; }
label { display: block; font-weight: bold; margin-bottom: 8px; }
input {
  width: 100%; padding: 16px; border: 2px solid #789498;
  border-radius: 12px; font: inherit; background: white;
}
details {
  margin-top: 24px; background: white; border: 1px solid #b8cccc;
  border-radius: 16px; padding: 20px;
}
summary { cursor: pointer; font-weight: bold; font-size: 21px; }
.button {
  display: inline-block; background: #086d77; color: white;
  padding: 14px 22px; border-radius: 10px; text-decoration: none;
}
a:focus-visible, summary:focus-visible, input:focus-visible {
  outline: 3px solid #c17400; outline-offset: 4px;
}
.note { color: #526b70; font-size: 16px; }
footer { margin-top: 36px; }
footer a { color: #086d77; }
</style>
</head>
<body>
<header>
  <div>
    <h1>いなわくTV ヘルプ</h1>
    <p>困ったときの、よくあるご質問</p>
  </div>
</header>
<main>
  <p class="note">試作版：現在は質問を1件掲載しています。</p>
  <label for="search">知りたいことを検索</label>
  <input id="search" type="search" placeholder="例：メンバーシップ、動画">
  <details id="faq" open>
    <summary>メンバーシップの使い方の動画はありますか？</summary>
    <p>はい。メンバーシップ専用の動画はいくつかご用意しております。再生リストをご覧ください。</p>
    <a class="button"
       href="https://youtube.com/playlist?list=PLa3belS0rIMbMLR-Utkl3t_3OWtoWyhmN">
      動画を見る
    </a>
  </details>
  <p id="empty" role="status" hidden>該当する質問がありません。別の言葉で検索してください。</p>
  <footer><a href="https://inawakutv.com/">いなわくTVのホームページへ</a></footer>
</main>
<script>
const search = document.getElementById('search');
const faq = document.getElementById('faq');
const empty = document.getElementById('empty');
const keywords = faq.textContent.normalize('NFKC').toLowerCase();
search.addEventListener('input', () => {
  const words = search.value.normalize('NFKC').toLowerCase().trim().split(/\s+/);
  const match = words.every(word => keywords.includes(word));
  faq.hidden = !match;
  empty.hidden = match;
});
</script>
</body>
</html>
